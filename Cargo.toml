[package]
name = "cross-spawn"
version = "0.1.0"
edition = "2021"
description = "A cross platform solution for spawning processes. Drop-in replacement for std::process::Command with Windows-specific enhancements: PATHEXT resolution, CMD built-in detection, CREATE_NO_WINDOW, and cross-platform kill."
license = "MIT"
repository = "https://github.com/ViktorVeselov/cross-spawn"
keywords = ["spawn", "process", "cross-platform", "windows", "command"]
categories = ["os"]

[dependencies]
thiserror = "2"
